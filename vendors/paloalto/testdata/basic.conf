set deviceconfig system hostname lab-pa1
set shared service 
set address web-01 ip-netmask 172.16.0.10
set address web-02 ip-netmask 172.16.0.11/32
set address lan ip-netmask 10.0.0.0/16
set address dmz-range ip-range 172.16.0.20-172.16.0.29
set address updates fqdn updates.example.com
set address public-web ip-netmask 198.51.100.80
set address isp-gw ip-netmask 203.0.113.1
set address "office uplink" ip-netmask 203.0.113.2/30
set address-group web-farm static [ web-01 web-02 dmz-range ]
set address-group tagged dynamic filter 'prod'
set service tcp-8080 protocol tcp port 8080
set service tcp-multi protocol tcp port 7020,15672,5672
set service dns-udp protocol udp port 53
set service "TCP 8000 8010" protocol tcp port 8000-8010 source-port 1024-65535
set service-group web members [ service-http service-https tcp-8080 ]
set schedule change-window schedule-type non-recurring 2026/11/01@00:00-2026/12/01@00:00
set schedule office schedule-type recurring weekly monday [ 08:00-18:00 ]
set zone trust network layer3 ethernet1/2
set zone untrust network layer3 [ ethernet1/1 ]
set zone dmz network layer3 ethernet1/3.100
set network interface ethernet ethernet1/1 layer3 ip "office uplink"
set network interface ethernet ethernet1/2 layer3 ip 10.0.0.1/24
set network interface ethernet ethernet1/3 layer3 units ethernet1/3.100 ip 172.16.0.1/24
set network interface ethernet ethernet1/3 layer3 units ethernet1/3.100 tag 100
set network virtual-router default interface [ ethernet1/1 ethernet1/2 ethernet1/3.100 ]
set network virtual-router default routing-table ip static-route default destination 0.0.0.0/0
set network virtual-router default routing-table ip static-route default nexthop ip-address isp-gw
set network virtual-router default routing-table ip static-route default interface ethernet1/1
set network virtual-router default routing-table ip static-route default metric 10
set network virtual-router default routing-table ip static-route lab destination 192.168.50.0/24
set network virtual-router default routing-table ip static-route lab nexthop next-vr test
set network virtual-router test interface [ ]
set rulebase security rules block-bad from untrust
set rulebase security rules block-bad to any
set rulebase security rules block-bad source 192.0.2.0/24
set rulebase security rules block-bad destination any
set rulebase security rules block-bad application any
set rulebase security rules block-bad service any
set rulebase security rules block-bad action drop
set rulebase security rules web-in from untrust
set rulebase security rules web-in to dmz
set rulebase security rules web-in source any
set rulebase security rules web-in destination public-web
set rulebase security rules web-in application any
set rulebase security rules web-in service web
set rulebase security rules web-in action allow
set rulebase security rules "Allow updates" from trust
set rulebase security rules "Allow updates" to untrust
set rulebase security rules "Allow updates" source lan
set rulebase security rules "Allow updates" destination updates
set rulebase security rules "Allow updates" application any
set rulebase security rules "Allow updates" service service-https
set rulebase security rules "Allow updates" action allow
set rulebase security rules apps from trust
set rulebase security rules apps to untrust
set rulebase security rules apps source lan
set rulebase security rules apps destination any
set rulebase security rules apps application [ ssl web-browsing ]
set rulebase security rules apps service application-default
set rulebase security rules apps action allow
set rulebase security rules not-lan from trust
set rulebase security rules not-lan to untrust
set rulebase security rules not-lan source lan
set rulebase security rules not-lan negate-source yes
set rulebase security rules not-lan destination any
set rulebase security rules not-lan service dns-udp
set rulebase security rules not-lan action deny
set rulebase security rules not-lan disabled yes
set rulebase security rules not-lan schedule office
set rulebase security rules web-in log-end yes
set rulebase nat rules dnat-web from untrust
set rulebase nat rules dnat-web to untrust
set rulebase nat rules dnat-web source any
set rulebase nat rules dnat-web destination public-web
set rulebase nat rules dnat-web service service-http
set rulebase nat rules dnat-web destination-translation translated-address web-01
set rulebase nat rules dnat-web destination-translation translated-port 8080
set rulebase nat rules snat-out from [ trust dmz ]
set rulebase nat rules snat-out to untrust
set rulebase nat rules snat-out source any
set rulebase nat rules snat-out destination any
set rulebase nat rules snat-out to-interface ethernet1/1
set rulebase nat rules snat-out source-translation dynamic-ip-and-port interface-address interface ethernet1/1
set rulebase nat rules static-web from dmz
set rulebase nat rules static-web to untrust
set rulebase nat rules static-web source web-02
set rulebase nat rules static-web destination any
set rulebase nat rules static-web source-translation static-ip translated-address 198.51.100.11
set rulebase nat rules static-web source-translation static-ip bi-directional yes
set rulebase default-security-rules rules intrazone-default action deny
set shared certificate lab-ca common-name lab-ca
set shared certificate lab-ca certificate "-----BEGIN CERTIFICATE-----
SYNTHETIC-CERTIFICATE-PAYLOAD
-----END CERTIFICATE-----
"
set device-group dg1 address x ip-netmask 10.9.9.9
