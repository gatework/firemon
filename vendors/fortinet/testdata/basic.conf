config router static
    edit 7
        set dst 203.0.113.0 255.255.255.0
        set gateway 198.51.100.254
    next
end
config system interface
    edit "lan1"
        set vdom "root"
        set ip 192.0.2.1 255.255.255.0
        set type physical
    next
    edit "wan1"
        set vdom "root"
        set ip 198.51.100.1 255.255.255.0
        set type physical
    next
end
config system zone
    edit "inside"
        set interface "lan1"
        set intrazone deny
    next
end
config firewall addrgrp
    edit "clients"
        set member "client"
    next
end
config firewall address
    edit "client"
        set subnet 192.0.2.10 255.255.255.255
    next
    edit "server"
        set type iprange
        set start-ip 203.0.113.10
        set end-ip 203.0.113.20
    next
end
config firewall service group
    edit "paired"
        set member "web-dns"
    next
end
config firewall service custom
    edit "web-dns"
        set tcp-portrange 443:1000-1001
        set udp-portrange 53:2000
    next
end
config firewall policy
    edit 10
        set name "paired-policy"
        set srcintf "inside"
        set dstintf "wan1"
        set srcaddr "clients"
        set dstaddr "server"
        set action accept
        set schedule "always"
        set service "paired"
        set logtraffic all
    next
end
