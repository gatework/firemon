set interface "ethernet0/0" zone "inside"
set interface ethernet0/0 ip 192.0.2.1/24
set address "inside" "leaf" 192.0.2.10 255.255.255.255
set group address "inside" "hosts"
set group address "inside" "hosts" add "leaf"
set service "web" protocol tcp src-port 0-65535 dst-port 80-80
set service "web" + tcp src-port 0-65535 dst-port 443-443
set group service "apps"
set group service "apps" add "web"
set policy id 1 from "inside" to "inside" "hosts" "hosts" "apps" permit
exit
set policy id 2 from "inside" to "inside" "hosts" "hosts" "apps" permit
exit
