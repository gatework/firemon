config system interface
 edit "port1"
  set vdom "root"
  set ip 192.0.2.1 255.255.255.0
 next
end
config system zone
 edit "inside"
  set interface "port1"
 next
end
config firewall address
 edit "leaf"
  set subnet 192.0.2.10 255.255.255.255
 next
end
config firewall addrgrp
 edit "hosts"
  set member "leaf"
 next
end
config firewall service custom
 edit "web"
  set tcp-portrange 80 443
 next
end
config firewall service group
 edit "apps"
  set member "web"
 next
end
config firewall policy
 edit 1
  set srcintf "inside"
  set dstintf "inside"
  set srcaddr "hosts"
  set dstaddr "hosts"
  set service "apps"
  set schedule "always"
  set action accept
 next
end
config firewall policy
 edit 2
  set srcintf "inside"
  set dstintf "inside"
  set srcaddr "hosts"
  set dstaddr "hosts"
  set service "apps"
  set schedule "always"
  set action accept
 next
end
