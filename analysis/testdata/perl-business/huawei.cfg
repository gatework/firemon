interface GigabitEthernet0/0/1
 ip address 192.0.2.1 255.255.255.0
#
firewall zone name inside
 add interface GigabitEthernet0/0/1
#
ip address-set leaf type object
 address 0 192.0.2.10 mask 32
#
ip address-set hosts type group
 address 0 address-set leaf
#
ip service-set web type object
 service 0 protocol tcp source-port 0 to 65535 destination-port 80
 service 1 protocol tcp source-port 0 to 65535 destination-port 443
#
ip service-set apps type group
 service 0 service-set web
#
security-policy
 rule name allow
  source-zone inside
  destination-zone inside
  source-address address-set hosts
  destination-address address-set hosts
  service apps
  action permit
#
