# firemon import boundaries (STANDARD.md ARC-1), enforced by archcheck in `make check`.
# Direction: cmd -> internal/cli -> internal/bootstrap -> internal/workflow
#            -> query/design/deploy -> firemon -> traffic; vendors and adapter point inward.
declared:
  - .
  - ./traffic
  - ./vendors/hillstone
  - ./vendors/paloalto
  - ./query
  - ./design

rules:
  - name: domain packages stay free of I/O
    packages: [., ./traffic, ./query, ./design]
    deny: [os, os/exec, io/fs, net, net/http, database/sql, path/filepath, syscall,
           github.com/gatework/net-connector/..., github.com/gatework/go-expect/...]

  - name: traffic is the base algebra
    packages: [./traffic]
    deny: [./...]

  - name: the domain depends only on traffic
    packages: [.]
    only_local: [./traffic]

  - name: vendors depend only on the domain and the shared parser
    packages: [./vendors/...]
    only_local: [., ./traffic, ./design]
    deny: [os, os/exec, net, net/http, github.com/gatework/net-connector/...]

  - name: query evaluates the domain only
    packages: [./query]
    only_local: [., ./traffic]

  - name: design plans on the domain and the query engine
    packages: [./design]
    only_local: [., ./traffic, ./query]
